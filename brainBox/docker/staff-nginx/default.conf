# Staff dashboard on its own port (docker-compose service "staff", default host port 2029).
# Serves the static build from sdk-web/staff and forwards the API to the api container,
# so the dashboard and the API share one origin. Plain HTTP: test use only.
server {
    listen 80;
    server_name _;
    client_max_body_size 30m;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=604800, immutable"; }
    location / { try_files $uri $uri/ /index.html; }

    # SDK downloads referenced by the Train AI > SDK tab
    location /sdk/downloads/ { alias /usr/share/nginx/downloads/; }

    location ~ ^/(api/|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # streamed answers and live updates (SSE)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
