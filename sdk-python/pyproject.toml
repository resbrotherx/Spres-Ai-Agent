# sdk-python/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spres-ai"
version = "1.1.0"
description = "Official Brainbox (Spres AI) SDK for Python: train your Brainbox from files, text, databases and APIs, and chat with it"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "resbrotherx", email = "spres-ai@resbrotherx.com"}
]
keywords = ["brainbox", "spres-ai", "spres-ai-agent", "spres", "training", "knowledge-base", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/resbrotherx/Spres-Ai-Agent/tree/main/sdk-python"
Documentation = "https://port.smartpowerbilling.com/docs"
Download = "https://port.smartpowerbilling.com/sdk/downloads/"
Repository = "https://github.com/resbrotherx/Spres-Ai-Agent"

[tool.setuptools]
py-modules = ["brainbox_sdk"]
