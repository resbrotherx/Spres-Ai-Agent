<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainbox Web Widget Example</title>
  </head>
  <body>
    <!--
      Never ship a real API key in public HTML. For production, point apiUrl at a
      same-origin proxy on your server that adds the key (see README "Proxy mode").
    -->
    <script src="https://port.smartpowerbilling.com/sdk/brainbox-web-sdk.js"></script>
    <script>
      const bb = Brainbox.init({
        apiUrl: 'https://port.smartpowerbilling.com',
        apiKey: 'YOUR_API_KEY',
        tenantId: 'YOUR_TENANT_ID',
        mode: 'floating',
        position: 'bottom-right',
        theme: { primary: '#2563EB', ink: '#111827' },
        branding: { botName: 'Support', subtitle: "We're here to help" },
        launcher: { type: 'button', text: 'Support Chat' },
        placeholder: 'Ask a question',
        width: 360,
        height: 520
      });
    </script>
  </body>
</html>
